apiVersion: apps/v1
kind: Deployment
metadata:
  name: scaletestapp
  labels:
    app: scaletestapp
spec:
  replicas: 1                      # стартовое количество реплик — по заданию
  selector:
    matchLabels:
      app: scaletestapp
  template:
    metadata:
      labels:
        app: scaletestapp
    spec:
      containers:
        - name: scaletestapp
          image: ghcr.io/yandex-practicum/scaletestapp:latest
          ports:
            - containerPort: 8080  # GET / и GET /metrics доступны на 8080
          resources:
            requests:
              # requests ОБЯЗАТЕЛЕН: HPA считает утилизацию как usage/requests.
              # Уменьшены, чтобы порог 80% достигался при меньшей нагрузке (легче масштабирование).
              memory: "20Mi"       # резерв памяти (не cap); 80% от 20Mi = 16Mi
              cpu: "30m"           # idle ~19m = ~63% (ниже 80% -> без масштабирования на простое);
                                   #   под нагрузкой CPU переходит 24m (80%) -> HPA добавляет поды.
                                   #   У GET / память нагрузко-независима, поэтому триггер — CPU.
            limits:
              memory: "30Mi"       # лимит памяти = 30Mi (по заданию); при превышении -> OOMKilled
              cpu: "100m"          # верхний предел CPU (~3x от requests). Ниже -> под быстрее упирается
                                   #   в потолок под нагрузкой и HPA активнее масштабирует; слишком
                                   #   низко (близко к requests) -> троттлинг и таймауты ответов.
