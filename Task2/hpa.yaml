apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: scaletestapp-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: scaletestapp
  minReplicas: 1
  maxReplicas: 10              # максимум реплик — по заданию
  metrics:
    # Целевая утилизация памяти 80% — по заданию.
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
    # Вторая метрика — CPU 80%. HTTP-нагрузка на GET / почти не наращивает память,
    # поэтому память сама по себе может не дать сигнала к масштабированию. HPA берёт
    # максимум из рекомендаций по обеим метрикам, и под нагрузкой срабатывает CPU
    # (в подтверждённом прогоне — 329% при цели 80%, см. scaling-log.txt).
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
