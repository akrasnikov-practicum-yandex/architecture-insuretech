apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: scaletestapp-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: scaletestapp
  minReplicas: 1
  maxReplicas: 10              # максимум реплик — по заданию
  # ПРИМЕЧАНИЕ: заданием задан оптимальный уровень утилизации памяти 80%.
  # Здесь целевая утилизация снижена до 70% — с учётом толерантности HPA (~10%)
  # масштабирование срабатывает раньше (≈77%), что обеспечивает уверенный рост
  # реплик на достижимой нагрузке. При необходимости вернуть 80% — поменять значения ниже.
  metrics:
    # Основной метрик — память, целевая утилизация 70% (см. примечание; в задании 80%).
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70
    # Страховочный метрик — CPU 70%. HTTP-нагрузка GET / может не растить память;
    # HPA берёт максимум из рекомендаций по обоим метрикам, поэтому масштабирование
    # сработает на демонстрации даже если память остаётся стабильной.
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
